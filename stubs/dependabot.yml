# Opens a pull request on development whenever a new MelaCMS core version is
# released, so updating the CMS is: review the PR, let CI run, merge.
#
# The commit prefix is `fix` on purpose: release-please only cuts a release for
# feat/fix commits, and a core update should reach production like any other fix.
#
# melasistema/mela-cms is a private repository, so Dependabot needs a token to
# read it: the `registries` blocks below use a Dependabot secret named
# COMPOSER_TOKEN (Settings -> Secrets and variables -> Dependabot). Add
# COMPOSER_AUTH as a Dependabot secret too, so CI can run on its pull requests.
version: 2
registries:
  mela-cms:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.COMPOSER_TOKEN }}
updates:
  - package-ecosystem: composer
    directory: /
    registries:
      - mela-cms
    schedule:
      interval: daily
    target-branch: development
    allow:
      - dependency-name: melasistema/mela-cms
    commit-message:
      prefix: fix
      include: scope
