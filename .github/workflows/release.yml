# Release for the MelaCMS core package: test -> release, on every push to master.
#
# How it works (https://github.com/googleapis/release-please):
#   1. development is merged into master using conventional commits
#      (feat: ..., fix: ..., feat!: ... for a breaking change).
#   2. release-please opens or updates a "release PR" that bumps version.txt and
#      writes CHANGELOG.md from those commits.
#   3. Merging the release PR creates the vX.Y.Z tag and the GitHub Release.
#      Packagist picks the tag up through its GitHub hook, and client sites get
#      the new version with `composer update melasistema/mela-cms`.
#
# Settings live in release-please-config.json; the last released version is
# tracked in .release-please-manifest.json (maintained by release-please).
#
# One-time setup:
#   Settings -> Actions -> General -> Workflow permissions ->
#     enable "Allow GitHub Actions to create and approve pull requests".
name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release-please:
    name: Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
